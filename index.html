```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Komal ❤️</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:cursive;
}

body{
    background:url("https://i.pinimg.com/originals/51/d8/37/51d8374126446d495348b6032202126f.jpg");
    background-size:cover;
    background-position:center;
}

.bg_heart{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
}

.container{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    text-align:center;
    z-index:2;
}

.photo-frame{
    width:260px;
    height:260px;
    border-radius:20px;
    overflow:hidden;
    border:4px solid white;
    box-shadow:0 0 30px rgba(255,255,255,0.8);
    margin-bottom:25px;
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity 1s ease;
}

#text1{
    color:white;
    text-shadow:2px 2px 10px black;
    line-height:1.8;
    max-width:900px;
    font-weight:bold;
}

@media(max-width:768px){
    #text1{
        font-size:18px;
    }

    .photo-frame{
        width:220px;
        height:220px;
    }
}

@media(min-width:769px){
    #text1{
        font-size:28px;
    }
}

.heart{
    position:absolute;
    top:-10%;
    transform:rotate(-45deg);
    animation:love 6s linear;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:inherit;
    border-radius:50%;
}

.heart:before{
    top:-50%;
    left:0;
}

.heart:after{
    top:0;
    right:-50%;
}

@keyframes love{
    0%{
        top:110%;
        opacity:1;
    }

    100%{
        top:-10%;
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="bg_heart"></div>

<div class="container">

    <div class="photo-frame">
        <img id="komalPhoto" src="komal1.jpg" alt="Komal">
    </div>

    <div id="text1"></div>

</div>

<!-- Put your song in same folder and rename it to komal-song.mp3 -->

<audio id="bgmusic" autoplay loop>
    <source src="komal-song.mp3" type="audio/mp3">
</audio>

<script>

// Music Play

window.addEventListener("load", function(){

    let music = document.getElementById("bgmusic");

    music.play().catch(() => {

        document.body.addEventListener("click", function(){
            music.play();
        }, {once:true});

        document.body.addEventListener("touchstart", function(){
            music.play();
        }, {once:true});

    });

});


// Photo Rotation

const photos = [
    "komal1.jpg",
    "komal2.jpg",
    "komal3.jpg",
    "komal4.jpg",
    "komal5.jpg"
];

let currentPhoto = 0;

setInterval(() => {

    currentPhoto = (currentPhoto + 1) % photos.length;

    const img = document.getElementById("komalPhoto");

    img.style.opacity = "0";

    setTimeout(() => {

        img.src = photos[currentPhoto];

        img.style.opacity = "1";

    }, 500);

}, 3000);


// Floating Hearts

setInterval(function(){

    var r_size = Math.floor(Math.random() * 60) + 10;
    var r_left = Math.floor(Math.random() * 100) + 1;
    var r_bg = Math.floor(Math.random() * 25) + 100;
    var r_time = Math.floor(Math.random() * 5) + 5;

    $('.bg_heart').append(

        "<div class='heart' style='width:" + r_size +
        "px;height:" + r_size +
        "px;left:" + r_left +
        "%;background:rgba(255," +
        (r_bg - 25) + "," +
        r_bg +
        ",1);animation:love " +
        r_time +
        "s linear'></div>"

    );

    $('.heart').each(function(){

        var top = $(this).css("top").replace(/[^-\d\.]/g,'');

        if(top <= -100){
            $(this).remove();
        }

    });

},500);


// Message

var i = 0;

var txt1 =
"Dear Komal ❤️ << " +
"Aaj mujhe tumse kuch special kehna hai, isliye please is message ko poora padhna... << " +
"Sach kahu to mujhe hamesha lagta tha ki meri life me kuch missing hai. << " +
"Phir dheere dheere tum meri life me aayi aur pata hi nahi chala kab tum meri soch ka ek important hissa ban gayi. << " +
"Tumhari smile, tumhara nature aur tumhari simplicity mujhe bahut pasand hai. 🥰 << " +
"Jab bhi tumhari photo dekhta hu ya tumse baat hoti hai, pura din achha lagne lagta hai. << " +
"Shayad tumhe andaza bhi nahi hoga ki tum mere liye kitni special ho. ❤️ << " +
"Main future ke baare me nahi jaanta, lekin itna zaroor jaanta hu ki tum meri life ki sabse khoobsurat feelings me se ek ho. << " +
"Thank you for being so wonderful Komal. 💖 << " +
"Stay happy, keep smiling and always remain the amazing person you are. ❤️";

var speed = 55;

typeWriter();

function typeWriter(){

    if(i < txt1.length){

        if(txt1.charAt(i) == "<"){

            document.getElementById("text1").innerHTML += "<br><br>";

        }

        else{

            document.getElementById("text1").innerHTML += txt1.charAt(i);

        }

        i++;

        setTimeout(typeWriter, speed);
    }

}

</script>

</body>
</html>
